<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="760" height="112" rx="10" fill="#161b22" stroke="#30363d"/>
